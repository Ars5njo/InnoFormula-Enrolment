name: innoformula_enrolment
description: "Общий лидерборд посещаемости клуба InnoFormula."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/attendance/
    - assets/fonts/OFL.txt
    - assets/fonts/RussoOne-OFL.txt
    - assets/branding/club-mark.png
  fonts:
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText.ttf

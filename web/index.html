<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Общий лидерборд посещаемости клуба InnoFormula. Каждая встреча считается.">
  <meta name="theme-color" content="#14141e">
  <link rel="icon" type="image/png" href="assets/assets/branding/club-mark.png">
  <link rel="manifest" href="manifest.json">
  <title>InnoFormula — посещаемость клуба</title>
  <style>
    html,body { margin:0; background:#14141e; color:#f5f5f7; }
    #boot { font:14px sans-serif; min-height:100vh; display:grid; place-content:center; gap:20px; text-align:center; }
    #boot strong { font-size:22px; letter-spacing:2px; }
    #boot span { color:#acadb6; }
    #boot:before { content:""; height:3px; background:#ff3b30; width:48px; margin:auto; }
  </style>
</head>
<body>
  <div id="boot" role="status"><strong>INNOFORMULA</strong><span>Загружаем таблицу посещаемости…</span></div>
  <noscript>Для просмотра рейтинга включите JavaScript.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('boot')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
